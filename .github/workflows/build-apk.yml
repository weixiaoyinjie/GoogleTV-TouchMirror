name: Build GoogleTV TouchMirror APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'GoogleTV_TouchMirror_v1_OneUpload.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Checkout your upload repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'

      - name: Unpack dedicated touch modifications
        run: |
          test -s GoogleTV_TouchMirror_v1_OneUpload.zip
          mkdir -p mirror-kit
          unzip -oq GoogleTV_TouchMirror_v1_OneUpload.zip -d mirror-kit
          test -f mirror-kit/patch/patch_tv.py

      - name: Get pinned MIT-licensed Android scrcpy client
        run: |
          git clone https://github.com/feggaa/scrcpy-android.git upstream
          cd upstream
          git checkout c451e80bf00c81a93a8a0837acba5b0cbe30a575

      - name: Apply Google TV optimized control and navigation
        run: python3 mirror-kit/patch/patch_tv.py upstream

      - name: Add official matching scrcpy 4.1 server
        run: |
          mkdir -p upstream/app/src/main/assets
          curl -fL --retry 3 --connect-timeout 30 \
            https://github.com/Genymobile/scrcpy/releases/download/v4.1/scrcpy-server-v4.1 \
            -o upstream/app/src/main/assets/scrcpy-server
          test $(stat -c%s upstream/app/src/main/assets/scrcpy-server) -gt 20000
          file upstream/app/src/main/assets/scrcpy-server

      - name: Compile phone Android APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Check APK exists
        run: test -s upstream/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoogleTV-TouchMirror-v1-debug-APK
          path: upstream/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
