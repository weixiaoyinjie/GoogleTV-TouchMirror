name: Build GoogleTV TouchMirror APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'GoogleTV_TouchMirror_v1_OneUpload.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read

    steps:
      - name: Checkout your upload repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub Ubuntu already contains a working Android SDK. The previous
      # setup-android@v3 action failed while attempting to replace sdkmanager.
      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          test -x "$SDK/cmdline-tools/latest/bin/sdkmanager"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Preinstalled runner normally has accepted licenses; retry any remaining.
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'
          test -d "$ANDROID_HOME/platforms/android-36"

      - name: Unpack dedicated touch modifications
        shell: bash
        run: |
          set -euo pipefail
          test -s GoogleTV_TouchMirror_v1_OneUpload.zip
          mkdir -p mirror-kit
          unzip -oq GoogleTV_TouchMirror_v1_OneUpload.zip -d mirror-kit
          test -s mirror-kit/patch/patch_tv.py

      - name: Get pinned Android scrcpy client
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/feggaa/scrcpy-android.git upstream
          git -C upstream checkout c451e80bf00c81a93a8a0837acba5b0cbe30a575

      - name: Get native BoringSSL build dependency
        shell: bash
        run: |
          set -euo pipefail
          test -s upstream/app/src/main/cpp/CMakeLists.txt
          if [ ! -f upstream/app/src/main/cpp/boringssl/CMakeLists.txt ]; then
            git clone --depth 1 https://github.com/google/boringssl.git \
              upstream/app/src/main/cpp/boringssl
          fi
          test -s upstream/app/src/main/cpp/boringssl/CMakeLists.txt
          git -C upstream/app/src/main/cpp/boringssl rev-parse --short HEAD

      - name: Apply Google TV optimized control and navigation
        run: python3 mirror-kit/patch/patch_tv.py upstream

      - name: Add official matching scrcpy 4.1 server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream/app/src/main/assets
          curl -fL --retry 3 --retry-delay 3 --connect-timeout 30 \
            https://github.com/Genymobile/scrcpy/releases/download/v4.1/scrcpy-server-v4.1 \
            -o upstream/app/src/main/assets/scrcpy-server
          test "$(stat -c%s upstream/app/src/main/assets/scrcpy-server)" -gt 20000
          file upstream/app/src/main/assets/scrcpy-server

      - name: Compile phone Android APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --max-workers=2 :app:assembleDebug

      - name: Check APK exists
        run: test -s upstream/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoogleTV-TouchMirror-v1-debug-APK
          path: upstream/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
